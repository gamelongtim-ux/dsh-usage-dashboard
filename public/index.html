<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh 用量总览 · DeepSeek Harness</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="brand-row">
    <div class="brand">dsh 用量总览 <span class="sub">DeepSeek Harness</span></div>
  </div>

  <div id="emptyBanner" class="card empty" style="display:none">未找到 dsh 会话记录</div>

  <!-- 顶部融合卡：余额 + 时间范围 + 统计 -->
  <div class="card" id="overviewCard">
    <div class="bal-row">
      <div class="bal-left">
        <span class="dot" id="balDot"></span>
        <span class="bal-title">DeepSeek API 余额</span>
        <span class="bal-val" id="balVal">--</span>
        <span class="bal-sub" id="balSub"></span>
      </div>
      <div class="bal-right">
        <span class="lbl">时间范围</span>
        <div class="seg" id="rangeSeg">
          <button data-range="1">今日</button>
          <button data-range="7" class="on">近 7 日</button>
          <button data-range="30">近 30 日</button>
        </div>
        <button class="btn small" id="refreshBtn">⟳</button>
        <button class="btn small" id="balKeyBtn">设置 Key</button>
      </div>
    </div>
    <div class="ov-sep"></div>
    <div class="tiles four" id="activityTiles"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="card-title">用量图表</div>
      <div class="seg" id="chartTabSeg">
        <button data-tab="trend" class="on">每日 Token 趋势</button>
        <button data-tab="donut">模型用量</button>
      </div>
    </div>
    <div id="trendPane">
      <div class="legend" id="trendLegend"></div>
      <div id="trendChart" class="chart"></div>
    </div>
    <div id="donutPane" class="donut-wrap" style="display:none">
      <div id="donut" class="donut"></div>
      <div id="donutLegend" class="mrows"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="toggles">
        <div class="seg" id="unitSeg">
          <button data-unit="tokens" class="on">Token 消耗</button>
          <button data-unit="cost">费用估算</button>
        </div>
        <div class="seg" id="dimSeg">
          <button data-dim="model" class="on">模型</button>
          <button data-dim="tool">工具</button>
        </div>
      </div>
      <button class="btn small" id="priceBtn" style="display:none">单价设置</button>
    </div>
    <div class="legend" id="barLegend" style="margin-bottom:8px"></div>
    <div class="bar-total" id="barTotal"></div>
    <div id="barChart" class="chart"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="card-title">系统健康度</div>
      <div class="lbl" id="healthRange">近 7 日</div>
    </div>
    <div class="legend" id="healthLegend" style="margin-bottom:6px"></div>
    <div id="healthChart" class="chart"></div>
    <div class="note">各模型高峰期均 Decode 速度（tokens/s，按流式输出加权平均；今日视图按小时）</div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<div class="tip" id="tip" style="display:none"></div>

<dialog id="keyDlg">
  <div class="dlg-title">DeepSeek API Key <span class="sub">（仅保存在本浏览器，用于查询平台余额）</span></div>
  <div class="dlg-body">
    <input id="keyInput" type="password" placeholder="sk-..." autocomplete="off">
    <div class="note">留空并保存即清除已存 Key。不设置时插件会尝试读取 dsh 凭据里的 DEEPSEEK_API_KEY。</div>
  </div>
  <div class="dlg-foot">
    <button class="btn" id="keyClear">清除</button>
    <button class="btn" id="keyCancel">取消</button>
    <button class="btn primary" id="keySave">保存</button>
  </div>
</dialog>

<dialog id="priceDlg">
  <div class="dlg-title">费用估算单价 <span class="sub">（¥ / 百万 tokens，仅保存在本浏览器）</span></div>
  <div id="priceRows"></div>
  <div class="dlg-foot">
    <button class="btn" id="priceCancel">取消</button>
    <button class="btn primary" id="priceSave">保存</button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
